[package]
name = "orangui"
version = "0.0.0"
edition = "2024"
description = "Dioxus UI kit: themes, panels, nav, charts and the entrance effects shared by my apps and sites"
repository = "https://github.com/scadoshi/orangui"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# The pure logic the components compute with, shared with non-Dioxus clients.
orangui-core = { path = "orangui-core" }
# Dioxus with its default features (macro/html/signals/hooks) but NO platform
# feature: each host enables its own web/mobile/desktop/fullstack and cargo
# unifies. A shared kit must not force a platform.
dioxus = { version = "0.7.9" }
# ThemeConfig serializes so a host can keep the last pick in local storage.
serde = { version = "1", features = ["derive"] }
# The toast stack, behind the `toast` feature so the sites never build it.
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "02801f27e4b3e30606e5c77e435c9d955c708eb3", version = "0.0.1", default-features = false, optional = true }

[dev-dependencies]
# Renders a component tree to HTML in the dialog tests.
dioxus-ssr = "0.7"

[features]
# ToastStack and TOAST_CSS, for the apps.
toast = ["dep:dioxus-primitives"]

# The entrance module waits between frames: the browser's timer on the web,
# tokio's everywhere else (an app's WebView runs on tokio already).
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.4", features = ["futures"] }
# use_persisted_theme keeps the picked theme in the browser's localStorage.
serde_json = "1"
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.47", features = ["time"] }

# use_os_back: the edge-swipe recognizer is a UIKit object on the WKWebView,
# and it reaches the app over a tokio channel.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
tokio = { version = "1.47", features = ["sync"] }

# use_os_back: back at a root screen finishes the Activity through JNI.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[workspace]
# orangui stays the root package, so a host's `orangui = { git = ... }` finds
# it where it always has; orangui-core is the Dioxus-free half beside it.
members = [".", "orangui-core"]
default-members = [".", "orangui-core"]
resolver = "3"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Pedantic lints that cost more than they catch.
module_name_repetitions = "allow"
# A library: builders and pure functions get #[must_use].
must_use_candidate = "warn"

# Docs: # Errors and # Panics sections everywhere.
missing_errors_doc = "warn"
missing_panics_doc = "warn"

# Never ship.
todo = "deny"
dbg_macro = "deny"
unimplemented = "deny"

# No panics outside tests (clippy.toml allows them inside tests).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
exit = "deny"

# Suppressions are #[expect] with a reason, so stale ones surface.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Unsafe explains itself, one operation per block.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"

# Casts and arithmetic that can silently lose information.
as_conversions = "warn"
arithmetic_side_effects = "warn"

# API shape.
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
too_many_arguments = "warn"
large_enum_variant = "warn"
redundant_clone = "warn"
needless_collect = "warn"
or_fun_call = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"

# Logging goes through tracing; a CLI's own output takes an #[expect].
print_stdout = "warn"
print_stderr = "warn"
