[package]
name = "orangui"
version = "0.0.0"
edition = "2024"
description = "Dioxus UI kit: themes, panels, nav, charts and the entrance effects shared by my apps and sites"
repository = "https://github.com/scadoshi/orangui"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Dioxus with its default features (macro/html/signals/hooks) but NO platform
# feature: each host enables its own web/mobile/desktop/fullstack and cargo
# unifies. A shared kit must not force a platform.
dioxus = { version = "0.7.9" }
# ThemeConfig serializes so a host can keep the last pick in local storage.
serde = { version = "1", features = ["derive"] }
# The toast stack, behind the `toast` feature so the sites never build it.
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "02801f27e4b3e30606e5c77e435c9d955c708eb3", version = "0.0.1", default-features = false, optional = true }

[features]
# ToastStack and TOAST_CSS, for the apps.
toast = ["dep:dioxus-primitives"]

# The entrance module waits between frames: the browser's timer on the web,
# tokio's everywhere else (an app's WebView runs on tokio already).
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.4", features = ["futures"] }
# use_persisted_theme keeps the picked theme in the browser's localStorage.
serde_json = "1"
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.47", features = ["time"] }

# use_os_back: the edge-swipe recognizer is a UIKit object on the WKWebView,
# and it reaches the app over a tokio channel.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
tokio = { version = "1.47", features = ["sync"] }

# use_os_back: back at a root screen finishes the Activity through JNI.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[lints.clippy]
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
expect_used = "warn"
indexing_slicing = "warn"
inefficient_to_string = "warn"
large_enum_variant = "warn"
needless_borrow = "warn"
needless_collect = "warn"
needless_range_loop = "warn"
or_fun_call = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
redundant_clone = "warn"
single_char_pattern = "warn"
todo = "warn"
too_many_arguments = "warn"
type_complexity = "warn"
unnecessary_to_owned = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"
unwrap_used = "warn"
