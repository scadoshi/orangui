name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Test
        run: cargo test --all-features

  # Format with nightly (rustfmt.toml uses an unstable option), lint with stable.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: rustfmt
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        run: cargo +nightly fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # The sites build the crate for the browser; the lint must hold there too.
      - name: Clippy for wasm
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy --target wasm32-unknown-unknown --all-features -- -D warnings
          cargo clippy -p orangui-core --target wasm32-unknown-unknown -- -D warnings
      # os_back and links carry iOS and Android code that only compiles for those
      # targets. iOS takes `links` alone: --all-features pulls `time` through
      # dioxus-primitives, whose num_threads dependency does not build for iOS here.
      - name: Clippy for iOS and Android
        run: |
          rustup target add aarch64-apple-ios aarch64-linux-android
          cargo clippy --lib --features links --target aarch64-apple-ios -- -D warnings
          cargo clippy --lib --all-features --target aarch64-linux-android -- -D warnings
      # Broken intra-doc links and other rustdoc warnings fail the way clippy's do.
      - name: Docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
